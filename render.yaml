databases:
  - name: surgical-operative-note-lab-db
    plan: free
    region: oregon
    databaseName: snl
    user: snl

services:
  - type: web
    name: surgical-operative-note-lab
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    # Fail closed if DATABASE_URL is missing, then start Next.
    startCommand: node scripts/check-prod-db.mjs && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set once in the dashboard and keep stable across deploys (do not regenerate).
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: surgical-operative-note-lab-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: DATA_DIR
        value: ./data
      - key: NEXT_PUBLIC_APP_NAME
        value: Surgical Operative Note Lab
      - key: NEXT_PUBLIC_APP_TAGLINE
        value: Research platform for surgical operative note dictation
      - key: ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_DRIVE_SYNC
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
